<!-- Contribution call-to-action (styles live in _sass/custom/custom.scss) -->
{% if page.path contains 'docs/' %}
<div class="contribution-box">
  <h4>💡 Make this page better</h4>
  <p>Spotted a missing grant or a dead link? Fixes take two minutes and help thousands of researchers.</p>
  <a href="https://github.com/yueyueL/awesome-grants/edit/main/{{ page.path }}" class="edit-this-page" target="_blank" rel="noopener noreferrer">
    Edit this page on GitHub
  </a>
  <a href="https://github.com/yueyueL/awesome-grants/issues/new/choose" class="edit-this-page" target="_blank" rel="noopener noreferrer">Suggest a grant</a>
</div>
{% endif %}

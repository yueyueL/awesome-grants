name: Refresh Data

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Scrape grant data
        run: python3 src/master_scraper.py

      - name: Regenerate wiki pages
        run: python3 src/enhanced_wiki_generator.py

      - name: Sync data files for the search page
        run: cp data/grants.json data/grants_live_master.json assets/data/

      - name: Open pull request with refreshed data
        uses: peter-evans/create-pull-request@v6
        with:
          branch: auto/data-refresh
          commit-message: 'Refresh grant data (automated)'
          title: 'Automated data refresh'
          body: |
            Automated weekly refresh of the grant dataset.

            - Scraped by `src/master_scraper.py` and regenerated by `src/enhanced_wiki_generator.py`.
            - See `data/last_run_report.json` on this branch for per-source scrape results.

name: Link Check

on:
  pull_request:
    paths:
      - '**/*.md'
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  link-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check links
        id: lychee
        uses: lycheeverse/lychee-action@v2
        # On scheduled runs, keep going so the follow-up step can open an issue.
        continue-on-error: ${{ github.event_name == 'schedule' }}
        with:
          args: --no-progress --include-fragments './**/*.md'
          fail: true

      - name: Open issue for broken links (scheduled runs)
        if: github.event_name == 'schedule' && env.lychee_exit_code != 0
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: 'Link checker report: broken links found'
          content-filepath: ./lychee/out.md
          labels: |
            report
            automated
